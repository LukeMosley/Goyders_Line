<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goyder's Line map — embed example</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#F4EFE6;color:#2B2B2B}
  p{padding:8px 12px;margin:0}
  .goyder-map{width:100%;height:720px;border:0;display:block}
  @media (max-width:699px){.goyder-map{height:1200px!important}}
</style>
</head>
<body>
<p>Host page (simulated research-group website). The widget below is in an iframe, 100% wide and 720 px high (1200 px on a phone).</p>
<iframe class="goyder-map" src="./" title="Goyder's Line and South Australian rainfall map" loading="lazy"></iframe>
<p>Content after the iframe.</p>
</body>
</html>
