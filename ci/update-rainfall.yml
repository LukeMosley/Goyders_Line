# Monthly rainfall data update for the static widget (docs/).
# INSTALL: copy this file to .github/workflows/update-rainfall.yml on the default branch
# (it was not pushed there because the token used lacked the `workflow` scope).
name: Update rainfall data

on:
  schedule:
    # 20:00 UTC on the 4th = 6:30 am on the 5th in Adelaide (summer time). SILO has
    # the previous month complete by then. Scheduled runs only fire on the default branch.
    - cron: "0 20 4 * *"
  workflow_dispatch: {}   # "Run workflow" button for manual updates

permissions:
  contents: write

concurrency:
  group: update-rainfall
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-data.txt

      - name: Install data dependencies
        run: pip install -r scripts/requirements-data.txt

      - name: Update rainfall grids from SILO
        # Incremental: re-downloads only the current and previous year (~25 MB).
        run: python scripts/update_rainfall.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No new rainfall data."
            exit 0
          fi
          LAST=$(python -c "import json;m=json.load(open('docs/data/manifest.json'))['lastComplete'];print(f\"{m['year']}-{m['month']:02d}\")")
          git commit -m "Update rainfall data to ${LAST} (SILO)"
          git push
